[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost-context-lab-backend"
version = "0.3.0"
description = "Backend API for LLM Cost & Context Lab"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.7",
    "openai>=1.66",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant:UserWarning"]
