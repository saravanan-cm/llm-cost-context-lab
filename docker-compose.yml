services:
  # Local vector database. For local dev you only need this one:  docker compose up -d qdrant
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333" # REST API + dashboard at http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      CORS_ORIGINS: '["http://localhost:8080"]'
      QDRANT_URL: http://qdrant:6333
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  qdrant_data:
